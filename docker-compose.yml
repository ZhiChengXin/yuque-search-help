services:
  yuque-help-search:
    build: .
    image: yuque-help-search:latest
    container_name: yuque-help-search
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - TZ=Asia/Shanghai
    volumes:
      # 持久化本地向量等数据，避免重建容器后全量重算
      - ./data:/app/data
    # 如需挂载日志目录，可取消注释：
    #   - ./logs:/app/logs
