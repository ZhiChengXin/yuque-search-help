<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>孚盟MX 智能检索助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260819t" />
</head>
<body>
  <div class="bg-stage" aria-hidden="true">
    <div class="beam beam-a"></div>
    <div class="beam beam-b"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid-fade"></div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo" aria-hidden="true"><span></span></div>
        <div>
          <p class="eyebrow">Fumeng MX</p>
          <h1>智能检索助手</h1>
        </div>
      </div>

      <p class="sidebar-label">检索模式</p>
      <nav class="modes" id="modes">
        <button class="mode active" data-mode="all" type="button">
          <span class="mode-kicker">Smart</span>
          <strong>智能检索</strong>
          <em>标题 / 章节 / 正文一次搜</em>
        </button>
        <button class="mode" data-mode="faq" type="button">
          <span class="mode-kicker">FAQ</span>
          <strong>问题排查</strong>
          <em>故障现象与处理要点</em>
        </button>
        <button class="mode" data-mode="manual" type="button">
          <span class="mode-kicker">Guide</span>
          <strong>操作手册</strong>
          <em>步骤说明与功能指引</em>
        </button>
        <button class="mode" data-mode="owner" type="button">
          <span class="mode-kicker">Owner</span>
          <strong>模块负责人</strong>
          <em>测试与产品联系方式</em>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="status-card" id="statusBox">
          <span class="pulse" id="statusDot"></span>
          <div>
            <strong id="statusTitle">连接中</strong>
            <p id="statusText">正在同步知识库…</p>
          </div>
        </div>
        <button class="ghost-btn" id="syncBtn" type="button">刷新知识库</button>
        <button type="button" class="feedback-side-btn" id="feedbackFab">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M4 4h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm14.5 3.5 3.2-1.3a.8.8 0 0 1 1.1.75v7.1a.8.8 0 0 1-1.1.75L18.5 13.8V7.5z"/>
          </svg>
          <span>我要反馈</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <section class="search-stage" id="searchStage" data-mode="all">
        <label for="q" id="searchHint">直接描述问题，例如「特定邮件打开导致网页崩溃」</label>
        <form id="searchForm" class="search-form">
          <input id="q" name="q" type="search" autocomplete="off" placeholder="描述问题、报错现象或功能名…" autofocus />
          <button type="submit" id="searchBtn"><span>立即检索</span></button>
        </form>
      </section>

      <section class="advice" id="adviceBox" hidden></section>
      <section class="meta" id="metaRow" hidden>
        <span id="resultMeta"></span>
      </section>
      <section class="notice" id="noticeBox" hidden></section>

      <section class="contacts" id="contacts" hidden></section>
      <section class="results" id="results" aria-live="polite"></section>

      <section class="idle-panel" id="emptyState">
        <div class="intro-note">
          <p>孚盟MX 智能检索助手汇聚操作手册、问题答疑与模块对接信息。输入问题后，优先返回最相关的原文定位；若暂未匹配到准确内容，将同步提供对应业务线的测试与产品联系人，便于售后、客户与内部同事快速闭环。</p>
        </div>
        <div class="suggest-block">
          <div class="suggest-head">
            <strong id="suggestTitle">试试这些问题</strong>
            <span id="suggestSub" hidden></span>
          </div>
          <div class="suggest-grid" id="suggestGrid"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="feedback-mask" id="feedbackMask" hidden>
    <form class="feedback-panel" id="feedbackForm">
      <h2>我要反馈</h2>
      <textarea id="feedbackText" rows="5" placeholder="请描述问题、具体模块、步骤或期望…"></textarea>
      <div class="feedback-shots" id="feedbackShots"></div>
      <p class="feedback-tip" id="feedbackTip">可在输入框内粘贴截图，最多 6 张</p>
      <div class="feedback-actions">
        <button type="button" class="ghost-btn" id="feedbackCancel">取消</button>
        <button type="submit" class="feedback-submit" id="feedbackSubmit">提交反馈</button>
      </div>
    </form>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" alt="预览大图" referrerpolicy="no-referrer" draggable="false" />
    </div>
    <div class="lightbox-tools">
      <button type="button" id="lightboxZoomOut" aria-label="缩小">−</button>
      <span id="lightboxZoomLabel">适应</span>
      <button type="button" id="lightboxZoomIn" aria-label="放大">+</button>
      <button type="button" id="lightboxZoomFit" aria-label="适应窗口">适应</button>
      <button type="button" id="lightboxZoomReset" aria-label="原图大小">原图</button>
    </div>
  </div>

  <script src="/static/app.js?v=20260819t"></script>
</body>
</html>
